<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 20px Helvetica, Arial, sans-serif; fill: #18181B; }
      .sub { font: 400 12px Helvetica, Arial, sans-serif; fill: #71717A; }
      .h { font: 700 12px Helvetica, Arial, sans-serif; fill: #1E3A5F; }
      .hw { font: 700 12px Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .b { font: 600 11px Helvetica, Arial, sans-serif; fill: #18181B; }
      .s { font: 400 10px Helvetica, Arial, sans-serif; fill: #52525B; }
      .n { font: 400 10px Helvetica, Arial, sans-serif; fill: #71717A; }
      .path { font: 700 11px Helvetica, Arial, sans-serif; fill: #1E3A5F; }
      .foot { font: 400 11px Helvetica, Arial, sans-serif; fill: #3F3F46; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1600" height="4" fill="#1E3A5F"/>

  <text x="40" y="36" class="title">UAF Target Architecture — Rewards platform modernization</text>
  <text x="40" y="58" class="sub">Domain boundaries · Reward System as core capability</text>

  <rect x="40" y="78" width="1520" height="32" fill="#EEF2F7" stroke="#1E3A5F"/>
  <text x="52" y="98" class="path">Channels → Integration fabric → Reward System → Orchestration / fulfillment</text>

  <!-- A -->
  <g id="A">
    <rect x="40" y="130" width="240" height="520" fill="#FFF" stroke="#D4D4D8"/>
    <rect x="40" y="130" width="240" height="48" fill="#EEF2F7" stroke="#D4D4D8"/>
    <text x="52" y="150" class="h">A · Channel systems</text>
    <text x="52" y="166" class="n">Existing UAF estate</text>
    <rect x="55" y="200" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="65" y="222" class="b">Credit card systems</text>
    <text x="65" y="240" class="s">Spend / auth events</text>
    <rect x="55" y="270" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="65" y="292" class="b">Loan systems</text>
    <text x="65" y="310" class="s">Drawdown / DD events</text>
    <rect x="55" y="340" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="65" y="362" class="b">Digital channels</text>
    <text x="65" y="380" class="s">Yes UA · sim · CRM</text>
    <text x="55" y="430" class="n">Systems of record.</text>
    <text x="55" y="446" class="n">Emit business events only.</text>
    <text x="55" y="462" class="n">No scoring / ledger math.</text>
  </g>

  <!-- B -->
  <g id="B">
    <rect x="320" y="130" width="240" height="520" fill="#FFF" stroke="#D4D4D8"/>
    <rect x="320" y="130" width="240" height="48" fill="#EEF2F7" stroke="#D4D4D8"/>
    <text x="332" y="150" class="h">B · Integration fabric</text>
    <text x="332" y="166" class="n">How we connect</text>
    <rect x="335" y="200" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="345" y="222" class="b">REST API</text>
    <text x="345" y="240" class="s">Use-case invoke · dry-run</text>
    <rect x="335" y="270" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="345" y="292" class="b">Event bus (Kafka)</text>
    <text x="345" y="310" class="s">Async delivery</text>
    <rect x="335" y="340" width="210" height="56" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="345" y="362" class="b">Batch / file</text>
    <text x="345" y="380" class="s">Bulk path</text>
    <text x="335" y="430" class="n">Stable contract:</text>
    <text x="335" y="446" class="n">ownerId + use-case code</text>
    <text x="335" y="462" class="n">Idempotent eventId</text>
  </g>

  <!-- C -->
  <g id="C">
    <rect x="600" y="130" width="420" height="520" fill="#E8EEF4" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="600" y="130" width="420" height="48" fill="#1E3A5F" stroke="#1E3A5F"/>
    <text x="612" y="150" class="hw">C · Reward System</text>
    <text x="612" y="166" class="hw">New core domain (NEW BUILD)</text>
    <rect x="620" y="200" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="630" y="222" class="b">Customer onboarding</text>
    <text x="630" y="238" class="s">Wallet · multi-currency</text>
    <rect x="820" y="200" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="830" y="222" class="b">Referrer management</text>
    <text x="830" y="238" class="s">Referral rules</text>
    <rect x="620" y="270" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="630" y="292" class="b">Posting engine</text>
    <text x="630" y="308" class="s">Double-entry settle</text>
    <rect x="820" y="270" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="830" y="292" class="b">Ledger books</text>
    <text x="830" y="308" class="s">Balances · movements</text>
    <rect x="620" y="340" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="630" y="362" class="b">Account rules (COA)</text>
    <text x="630" y="378" class="s">Finance profiles</text>
    <rect x="820" y="340" width="180" height="52" fill="#FFF" stroke="#D4D4D8"/>
    <text x="830" y="362" class="b">Points calculation</text>
    <text x="830" y="378" class="s">Formula engine</text>
    <rect x="620" y="420" width="380" height="36" fill="#EEF2F7" stroke="#1E3A5F"/>
    <text x="640" y="442" class="path">Runtime: event → admit → calculate → post → books → outbound</text>
    <text x="620" y="490" class="n">Ops-owned config (rules, COA, catalog).</text>
    <text x="620" y="506" class="n">Channels call use-cases — do not re-implement scoring math.</text>
  </g>

  <!-- D -->
  <g id="D">
    <rect x="1060" y="130" width="180" height="520" fill="#FFF" stroke="#D4D4D8"/>
    <rect x="1060" y="130" width="180" height="48" fill="#EEF2F7" stroke="#D4D4D8"/>
    <text x="1070" y="150" class="h">D · Platform add-ons</text>
    <text x="1070" y="166" class="n">Evolve later</text>
    <rect x="1075" y="210" width="150" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1100" y="234" class="b">Wallet tiering</text>
    <rect x="1075" y="270" width="150" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1095" y="294" class="b">Campaign packs</text>
    <rect x="1075" y="330" width="150" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1095" y="354" class="b">Future modules</text>
    <text x="1090" y="410" class="n">Extend without forking core</text>
  </g>

  <!-- E -->
  <g id="E">
    <rect x="1280" y="130" width="200" height="520" fill="#FFF" stroke="#D4D4D8"/>
    <rect x="1280" y="130" width="200" height="48" fill="#EEF2F7" stroke="#D4D4D8"/>
    <text x="1290" y="150" class="h">E · Fulfillment estate</text>
    <text x="1290" y="166" class="n">Existing + CBP</text>
    <rect x="1295" y="210" width="170" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1320" y="234" class="b">E-coupon / CBP</text>
    <rect x="1295" y="270" width="170" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1355" y="294" class="b">Gift</text>
    <rect x="1295" y="330" width="170" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1335" y="354" class="b">Notification</text>
    <rect x="1295" y="390" width="170" height="40" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1335" y="414" class="b">XAPI / CRM</text>
    <text x="1310" y="460" class="n">Behind hard boundary (p.2)</text>
  </g>

  <!-- arrows between columns -->
  <line x1="280" y1="390" x2="318" y2="390" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="390" x2="598" y2="390" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="390" x2="1058" y2="390" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1240" y1="390" x2="1278" y2="390" stroke="#52525B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="690" class="foot">UAF platform architecture — channels stay thin · Reward System centralized · fulfillment remains UAF-owned</text>
</svg>
