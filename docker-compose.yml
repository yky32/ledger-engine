# Local stack for ledger-engine.
# Defaults align with application.yml:
#   DB_URL=jdbc:postgresql://localhost:5433/ledger-engine
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
#
# Postgres only (host app on IDE):
#   docker compose up -d postgres
#
# Full stack:
#   docker compose up --build
# Digestion rules: POST /digestion-rules after app is up (no YAML seed)

services:
  postgres:
    image: postgres:17-alpine
    container_name: ledger-engine-postgres
    ports:
      # host 5433 → container 5432 (matches application.yml default DB_URL)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger-engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ledger-postgres:/var/lib/postgresql/data
      # optional init scripts
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledger-engine}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_URL: kafka:9092
      LEDGER_KAFKA_ENABLED: ${LEDGER_KAFKA_ENABLED:-true}
      LEDGER_KAFKA_TOPIC: ${LEDGER_KAFKA_TOPIC:-ledger.transaction.events}
      LEDGER_INTEGRATION_ENABLED: ${LEDGER_INTEGRATION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      SIM_MODE: ${SIM_MODE:-webhook}
      SIM_LEDGER_BASE_URL: ${SIM_LEDGER_BASE_URL:-http://app:8080}
      SIM_WEBHOOK_URL: ${SIM_WEBHOOK_URL:-http://app:8080/integrations/webhooks/transactions}
      SIM_KAFKA_BOOTSTRAP: ${SIM_KAFKA_BOOTSTRAP:-kafka:9092}
      SIM_KAFKA_TOPIC: ${SIM_KAFKA_TOPIC:-ledger.transaction.events}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-2}
      SIM_TRANSACTION_COUNT: ${SIM_TRANSACTION_COUNT:-20}
      SIM_CURRENCY: ${SIM_CURRENCY:-HKD}
      SIM_AMOUNT_MIN: ${SIM_AMOUNT_MIN:-10}
      SIM_AMOUNT_MAX: ${SIM_AMOUNT_MAX:-500}
      SIM_EVENT_TYPE: ${SIM_EVENT_TYPE:-PURCHASE}
      SIM_USER_ID_PREFIX: ${SIM_USER_ID_PREFIX:-01A}
      SIM_USER_COUNT: ${SIM_USER_COUNT:-5}
      SIM_BATCH_SIZE: ${SIM_BATCH_SIZE:-500}
      SIM_BATCH_PAUSE_SECONDS: ${SIM_BATCH_PAUSE_SECONDS:-0.05}
      SIM_ASSOCIATED_FROM: ${SIM_ASSOCIATED_FROM:-CRM}
      SIM_ONBOARD_WALLETS: ${SIM_ONBOARD_WALLETS:-true}
      SIM_CUSTOMER_FILE: ${SIM_CUSTOMER_FILE:-}
      SIM_SMOKE_EVENTS_AFTER_BACKFILL: ${SIM_SMOKE_EVENTS_AFTER_BACKFILL:-0}
      SIM_WAIT_FOR_HEALTH: ${SIM_WAIT_FOR_HEALTH:-true}
    volumes:
      - ./simulator/data:/data:ro
    depends_on:
      - app
    profiles:
      - simulator

volumes:
  ledger-postgres:
