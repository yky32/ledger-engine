spring:
  datasource:
    url: jdbc:h2:mem:ledger-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  liquibase:
    enabled: false

ledger:
  integration:
    enabled: true
    program-setup-enabled: true
    program-currencies:
      - LP
    kafka:
      enabled: false
    rules:
      - event-type: PURCHASE
        operation: EARN
        min-amount: 10
        point-currency: LP
        formula: AMOUNT
      - event-type: SIGNUP
        operation: EARN
        min-amount: 0
        point-currency: LP
        formula: FIXED:100
