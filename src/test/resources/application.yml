spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger-engine-test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

ledger:
  integration:
    enabled: true
    program-setup-enabled: true
    program-currencies:
      - LP
    kafka:
      enabled: false
    rules:
      - event-type: PURCHASE
        operation: EARN
        min-amount: 10
        point-currency: LP
        formula: AMOUNT
      - event-type: SIGNUP
        operation: EARN
        min-amount: 0
        point-currency: LP
        formula: FIXED:100
