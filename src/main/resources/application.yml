spring:
  application:
    name: ledger-engine
  datasource:
    url: jdbc:h2:file:./data/ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

ledger:
  movement:
    kafka:
      enabled: false
      initiated-topic: ledger.movement.initiated
      done-topic: ledger.movement.done
      balance-update-topic: ledger.movement.balance-update
      wallet-created-topic: ledger.wallet.created
      group-id: ledger-engine-movement
  integration:
    enabled: true
    program-setup-enabled: true
    program-currencies:
      - LP
    wallet-ref-template: "wallet:{userId}:{currency}"
    expense-pool-ref-template: "pool:loyalty-expense:{currency}"
    liability-pool-ref-template: "pool:loyalty-liability:{currency}"
    deposit-clearing-ref-template: "pool:clearing-deposit:{currency}"
    withdrawal-clearing-ref-template: "pool:clearing-withdrawal:{currency}"
    kafka:
      enabled: false
      topic: ledger.transaction.events
      group-id: ledger-engine
    rules:
      - event-type: PURCHASE
        operation: EARN
        min-amount: 10
        point-currency: LP
        formula: AMOUNT
      - event-type: SIGNUP
        operation: EARN
        min-amount: 0
        point-currency: LP
        formula: FIXED:100
      - event-type: REDEEM
        operation: BURN
        min-amount: 1
        point-currency: LP
        formula: AMOUNT
