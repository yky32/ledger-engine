spring:
  application:
    name: ledger-engine
  datasource:
    # Docker test-db (postgres) published on host 5433
    url: jdbc:postgresql://localhost:5433/ledger-engine
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  liquibase:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ledger:
  movement:
    kafka:
      enabled: false
      initiated-topic: ledger.movement.initiated
      done-topic: ledger.movement.done
      balance-update-topic: ledger.movement.balance-update
      wallet-created-topic: ledger.wallet.created
      group-id: ledger-engine-movement
  integration:
    enabled: true
    program-setup-enabled: true
    program-currencies:
      - LP
    wallet-ref-template: "wallet:{userId}:{currency}"
    expense-pool-ref-template: "pool:loyalty-expense:{currency}"
    liability-pool-ref-template: "pool:loyalty-liability:{currency}"
    deposit-clearing-ref-template: "pool:clearing-deposit:{currency}"
    withdrawal-clearing-ref-template: "pool:clearing-withdrawal:{currency}"
    kafka:
      enabled: false
      topic: ledger.transaction.events
      group-id: ledger-engine
    rules:
      - event-type: PURCHASE
        operation: EARN
        min-amount: 10
        point-currency: LP
        formula: AMOUNT
      - event-type: SIGNUP
        operation: EARN
        min-amount: 0
        point-currency: LP
        formula: FIXED:100
      - event-type: REDEEM
        operation: BURN
        min-amount: 1
        point-currency: LP
        formula: AMOUNT
