# Environment-sensitive values use ${ENV_VAR:default}.
# Override via env / docker-compose / K8s without editing this file.

server:
  port: ${SERVER_PORT:8080}
  max-http-header-size: ${SERVER_MAX_HTTP_HEADER_SIZE:10MB}
  servlet:
    context-path: ${CONTEXT_PATH:/}

config:
  system-invoker: ${SYSTEM_INVOKER:LEDGER}
  microservice:
    timezone: ${MICROSERVICE_TIME_ZONE:UTC}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:LEDGER-ENGINE}
  datasource:
    # Local Docker test-db default (host 5433 → container 5432)
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledger-engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        jdbc:
          time_zone: ${MICROSERVICE_TIME_ZONE:UTC}
    hibernate:
      # create | update | validate | none — be careful with create in shared envs
      ddl-auto: ${JPA_DDL_AUTO:create}
    show-sql: ${JPA_SHOW_SQL:true}
  liquibase:
    # Placeholder master changelog (includeAll). Keep false while using JPA ddl-auto.
    enabled: ${LIQUIBASE_ENABLED:false}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      properties:
        allow.auto.create.topics: ${KAFKA_ALLOW_AUTO_CREATE_TOPICS:true}

# Product domain (bound to @ConfigurationProperties)
ledger:
  movement:
    kafka:
      enabled: ${LEDGER_MOVEMENT_KAFKA_ENABLED:false}
      initiated-topic: ${LEDGER_MOVEMENT_INITIATED_TOPIC:ledger.movement.initiated}
      done-topic: ${LEDGER_MOVEMENT_DONE_TOPIC:ledger.movement.done}
      balance-update-topic: ${LEDGER_MOVEMENT_BALANCE_TOPIC:ledger.movement.balance-update}
      wallet-created-topic: ${LEDGER_WALLET_CREATED_TOPIC:ledger.wallet.created}
      group-id: ${LEDGER_MOVEMENT_KAFKA_GROUP:ledger-engine-movement}
  integration:
    enabled: ${LEDGER_INTEGRATION_ENABLED:true}
    wallet-ref-template: ${LEDGER_WALLET_REF_TEMPLATE:wallet:{associatedIdentifier}:{currency}}
    kafka:
      enabled: ${LEDGER_KAFKA_ENABLED:false}
      topic: ${LEDGER_KAFKA_TOPIC:ledger.transaction.events}
      group-id: ${LEDGER_KAFKA_GROUP:ledger-engine}
    # Domain seed rules (not secrets); override via profile YAML if needed.
    rules:
      - event-type: ${LEDGER_RULE_PURCHASE_EVENT_TYPE:PURCHASE}
        operation: ${LEDGER_RULE_PURCHASE_OPERATION:EARN}
        min-amount: ${LEDGER_RULE_PURCHASE_MIN_AMOUNT:10}
        point-currency: ${LEDGER_RULE_PURCHASE_POINT_CURRENCY:LP}
        formula: ${LEDGER_RULE_PURCHASE_FORMULA:AMOUNT}
      - event-type: ${LEDGER_RULE_SIGNUP_EVENT_TYPE:SIGNUP}
        operation: ${LEDGER_RULE_SIGNUP_OPERATION:EARN}
        min-amount: ${LEDGER_RULE_SIGNUP_MIN_AMOUNT:0}
        point-currency: ${LEDGER_RULE_SIGNUP_POINT_CURRENCY:LP}
        formula: ${LEDGER_RULE_SIGNUP_FORMULA:FIXED:100}
      - event-type: ${LEDGER_RULE_REDEEM_EVENT_TYPE:REDEEM}
        operation: ${LEDGER_RULE_REDEEM_OPERATION:BURN}
        min-amount: ${LEDGER_RULE_REDEEM_MIN_AMOUNT:1}
        point-currency: ${LEDGER_RULE_REDEEM_POINT_CURRENCY:LP}
        formula: ${LEDGER_RULE_REDEEM_FORMULA:AMOUNT}
