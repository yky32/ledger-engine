# Profile: postgres
# Default points at Docker Desktop container "test-db" (host port 5433).
# Override with DB_URL / DB_USERNAME / DB_PASSWORD if needed.
spring:
  datasource:
    # Host: Docker container test-db (5433→5432). Dedicated DB: ledger-engine
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledger-engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ledger:
  integration:
    kafka:
      # Off by default for local Postgres-only runs; set LEDGER_KAFKA_ENABLED=true to enable
      enabled: ${LEDGER_KAFKA_ENABLED:false}
      topic: ${LEDGER_KAFKA_TOPIC:ledger.transaction.events}
      group-id: ${LEDGER_KAFKA_GROUP_ID:ledger-engine}
